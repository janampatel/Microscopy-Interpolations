name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: CPU torch (small download)
        if: runner.os != 'macOS'
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install .
      - run: microinterp list
      - run: microinterp setup --yes
      - run: microinterp compare demo --backends rife --out cmp
      - name: RIFE score matches the README
        run: python -c "import json,statistics as s; p=s.mean(x[1] for x in json.load(open('cmp/scores.json'))['rife']); print(p); assert abs(p-30.90)<0.05"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
